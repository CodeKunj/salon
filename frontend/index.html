<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var p = window.location.pathname;
        if (/\/(admin|account|my-bookings|login|register|card|connect|share)(\/|$)/i.test(p)) {
          var b = document.createElement('base');
          b.setAttribute('data-admin-base', '1');
          b.href = (p.replace(/\/(admin|account|my-bookings|login|register|card|connect|share)(\/.*)?$/i, '') || '') + '/';
          document.head.appendChild(b);
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="./assets/logo-aura.svg" />
    <title>RiTiVerse &mdash; Luxury Hair, Dermal Therapy &amp; Aesthetic Salon</title>
